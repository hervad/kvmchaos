[project]
name = "kvmchaos"
version = "0.1.0"
description = "Agent-less chaos engineering CLI for KVM/libvirt VMs."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Vadym Herman" }]
keywords = ["kvm", "libvirt", "chaos-engineering", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Emulators",
]
dependencies = [
    "libvirt-python>=12.2.0",
    "typer>=0.12",
]

[project.scripts]
kvmchaos = "kvmchaos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvmchaos"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-q --cov=kvmchaos --cov-report=term-missing"
testpaths = ["tests"]
